syntax = "proto3";

package {{ .Package }};

import "scorix/v1/annotations.proto";

option go_package = "./types";

message Empty {}

message PingRequest {}

message PingReply {
  string status = 1;
}

// Payload for the sample server-push event below.
message TickEvent {
  int64 seq = 1;
}

// @middleware Auth
service Healthz {
  rpc Ping (PingRequest) returns (PingReply);

  // The option below makes Tick a one-way typed event, not a command.
  // Direction: default = Go -> JS push (Go: events.EmitHealthzTickCtx,
  // TS: events.onHealthzTick / useHealthzTickEvent); { direction: IN } for JS -> Go
  // (Go: events.OnX, TS: events.emitX).
  rpc Tick (TickEvent) returns (Empty) {
    option (scorix.v1.event) = {};
  }
}
