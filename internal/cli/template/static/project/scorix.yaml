# Scorix Project — single config source. Generated by scorix.
#   Top keys (proto/shell/model/package) : CLI build & codegen recipe.
#   `app:` … `logger:`                    : runtime manifest, embedded via
#   //go:embed scorix.yaml and read by app.New (one tauri.conf.json equivalent).
name: {{ .Name }}
proto: idl/app.proto
shell:
  type: nextjs
  dir: shell
  dist: shell/dist
model:
  schema: etc/schema.sql

# Runtime manifest (embedded; read by app.New)
app:
  name: {{ .Name }}
  version: 1.0.0
  identifier: com.example.{{ .Name }}
  single_instance: true # a second launch activates the running window and exits
  # protocols: [{{ .Name }}] # register {{ .Name }}:// links to open this app (sys:open-url)
  # file_types: [".ext"] # open matching files with this app (sys:open-file)
  description: "{{ .Name }} project"
  icon: assets/icon.ico # staged into the MSI/bundle by `scorix package`

mode: app

# web mode: override per-deploy via SCORIX_WEB_HOST / SCORIX_WEB_PORT.
web:
  host: 127.0.0.1
  port: 7000

dev:
  port: 7001
  hot_reload: true # `scorix dev` rebuilds + relaunches the Go app on source changes

window:
  title: {{ .Name }}
  width: 800
  height: 600
  debug: true
  # file_drop: true # deliver OS file drops as sys:file-drop with real paths
  # remember_state: true # restore last window position/size/maximized
  # theme: system # system|dark|light native titlebar (Windows)

# sealed: env / runtime overlay cannot loosen CSP or the allowlist (RCE guard).
# csp applies in BOTH modes (web header; app header+meta). The `default` preset
# keeps script-src 'unsafe-inline' - Next.js static export needs it.
security:
  csp: default
  allow_right_click: true
  # strict_modules: true # refuse modules that don't declare module.Capable
  # keys = capability names declared by modules (built-ins: fs shell clipboard notification db store tray)
  allowlist:
    fs: true
    shell: true
    clipboard: true
    notification: true

# modules:
#   http:
#     enabled: true
#     allow: ["api.example.com", "*.example.org"] # mod:http:Fetch denies everything else

logger:
  level: info
  format: console
  output: stdout
