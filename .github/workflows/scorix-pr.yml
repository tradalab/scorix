name: scorix checks

# Reusable build/test/lint pass for every scorix desktop app.
#
#   jobs:
#     check:
#       uses: tradalab/scorix/.github/workflows/scorix-pr.yml@v0.27.1
#       with:
#         runners: '["ubuntu-22.04","windows-2022","macos-14"]'   # optional
#
# Callers pass nothing unless they pin a different toolchain. Copying this file
# instead is how redishub ended up installing pnpm 10 for a repo that declares
# pnpm 11 and uses its `allowBuilds` syntax - the mismatch skips native builds
# rather than failing, so nothing said so.

on:
  workflow_call:
    inputs:
      scorix-version:
        type: string
        # Must match the tag this workflow ships in: a caller pins the workflow by
        # tag but gets the CLI named here. Bump it BEFORE cutting the tag.
        default: "v0.27.1"
      go-version:
        type: string
        default: "1.27"
      node-version:
        type: string
        default: "24"
      pnpm-version:
        type: string
        default: "11.22.0"
      runners:
        type: string
        # Machines to check on, as a JSON array. It is an input because a caller
        # cannot set `runs-on` on a reusable workflow - without it, an app
        # wanting Windows or macOS had to copy this whole setup block, and the
        # toolchain versions above then lived in two places.
        default: '["ubuntu-22.04"]'

jobs:
  check:
    strategy:
      # One platform failing should still report the others: the whole reason to
      # run more than one is to see which of them disagrees.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to pwsh; bash is on all three images and keeps
        # one syntax across the matrix.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: shell/pnpm-lock.yaml

      - name: Install scorix CLI
        run: go install github.com/tradalab/scorix/cmd/scorix@${{ inputs.scorix-version }}

      - name: Install frontend deps
        working-directory: shell
        run: pnpm install --frozen-lockfile

      # The CLI, not `make`: GNU make is not on the windows-2022 image, and a
      # per-repo Makefile made a green run mean something different in each one.
      # What an app adds is declared in its scorix.yaml `check:` block.
      #
      # Build first: main.go embeds .scorix/dist, so nothing else compiles until
      # that directory exists. No GTK/WebKit dev packages needed - the webview is
      # dlopen'd at runtime (no-CGO); only the AppImage build installs them.
      - name: Build
        run: scorix build

      - name: Test
        run: scorix test

      - name: Lint
        run: scorix lint
