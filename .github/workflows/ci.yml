name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1

  race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: race excluding webview2 (checkptr rejects its no-CGO COM laundering; not a data race)
        shell: bash
        run: go test -race -count=1 $(go list ./... | grep -v internal/driver/webview2)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # unsafeptr off, packages all on: it reads every uintptr in a pointer
      # conversion as a Go pointer, and all six it finds here are foreign. Dropping
      # whole packages instead is how the three drivers went unvetted entirely.
      - name: vet, every package on every platform
        run: |
          for os in linux windows darwin; do
            echo "== GOOS=$os"
            GOOS=$os go vet -unsafeptr=false ./... || exit 1
          done
      # arm64 because android/amd64 cannot link without cgo even for vet.
      - name: vet, android
        run: GOOS=android GOARCH=arm64 go vet -unsafeptr=false ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      # android matches the linux tag and ios the darwin one; this catches a desktop driver leaking in.
      - run: GOOS=android GOARCH=arm64 go build ./...
      # Libraries only: an ios binary cannot link without cgo, and go list refuses ios unless cgo is on.
      - run: |
          GOOS=ios GOARCH=arm64 go build $(GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go list -f '{{if and (ne .Name "main") .GoFiles}}{{.ImportPath}}{{end}}' ./...)
      # The cgo-off build above falls back to headless; only this compiles the real WebView driver.
      - name: android app library (cgo)
        run: |
          CC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$CC go vet -unsafeptr=false ./internal/driver/androidwebview ./native
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$CC go build ./internal/driver/androidwebview ./native ./app

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A probe, not a gate, until this job has a green run on record.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: webkitgtk runtime + a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xauth is a Recommends of xvfb, so --no-install-recommends drops it and
          # xvfb-run then quits with "xauth command not found" before any test runs.
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth openbox
      # The driver package rides along for its icon test; openbox is what Maximize and
      # keep-above report through.
      - name: e2e under Xvfb, with a window manager for the Maximize and keep-above round trips
        if: runner.os == 'Linux'
        env:
          SCORIX_E2E: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" bash -c "openbox & sleep 2; go test ./internal/e2e/ ./internal/driver/webkitgtk/ -count=1 -v"
      - name: e2e
        if: runner.os != 'Linux'
        env:
          SCORIX_E2E: "1"
        run: go test ./internal/e2e/ -count=1 -v

  # The only job on the webkitgtk 4.0 soname: every other one installs 4.1, so
  # the driver's dlopen fallback has never run in CI, and an LTS desktop is
  # exactly where it fires.
  e2e-oldest:
    runs-on: ubuntu-22.04
    continue-on-error: true # a probe until it goes green once, like macOS above
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: webkitgtk 4.0 runtime + a virtual display
        run: |
          sudo apt-get update
          # 4.0-37 is how 22.04 spells the 4.0 soname; installing only it is what
          # forces the fallback instead of letting 4.1 answer.
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-37 xvfb xauth openbox
      - name: e2e under Xvfb on the 4.0 soname
        env:
          SCORIX_E2E: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" bash -c "openbox & sleep 2; go test ./internal/e2e/ ./internal/driver/webkitgtk/ -count=1 -v"
